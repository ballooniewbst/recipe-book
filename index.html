["Braised, Roasted & Fried Mains",[
["Adobo","Pork or chicken braised in vinegar and soy sauce","1 kg chicken or pork, ½ cup vinegar, ½ cup soy sauce, 1 head garlic (crushed), 3 bay leaves, 1 tsp peppercorns, 1 cup water","Combine everything in a pot and marinate 30 minutes. Bring to a boil, then simmer covered 40 minutes until tender. Uncover and reduce the sauce, or pan-fry the meat for browned edges."],
["Lechon","Spit-roasted pig with crackling skin","Small pig (or 2 kg pork belly), 2 tbsp salt, 1 tsp pepper, lemongrass, garlic, scallions, 2 tbsp oil","Season the cavity with salt, pepper and garlic; stuff with lemongrass and scallions. Roast over charcoal 3–4 hours, turning often and basting with oil, until the skin is crisp. For belly, roll, tie and roast at 180°C for 2 hours."],
["Lechon Kawali","Deep-fried crispy pork belly","1 kg pork belly, 1 tbsp salt, 1 tbsp peppercorns, 3 bay leaves, oil for frying","Boil the belly with salt, pepper and bay leaves for 45 minutes. Dry completely and chill uncovered for 2 hours. Fry in hot oil until blistered and golden. Rest, chop, and serve with liver sauce or spiced vinegar."],
["Bagnet","Ilocano deep-fried pork belly","1 kg pork belly, 1 tbsp salt, 1 tsp peppercorns, 4 cups oil","Simmer the belly in salted water 1 hour; drain and air-dry overnight. Fry in two stages: low heat to render fat, then high heat until bubbly and crisp. Serve with bagoong and tomatoes."],
["Crispy Pata","Deep-fried pork knuckle","1 pork hock, 1 onion, 1 tbsp peppercorns, 3 bay leaves, 2 tbsp salt, oil for frying","Simmer the hock with aromatics 1½–2 hours until tender. Drain, dry thoroughly, and chill overnight. Fry in hot oil, spooning it over the hock, until skin is crisp. Serve with soy-vinegar dip."],
["Chicken Inasal","Bacolod-style grilled chicken","1 kg chicken legs, ½ cup calamansi juice, ¼ cup vinegar, 3 tbsp lemongrass, 6 garlic cloves, 1 tbsp ginger, 1 tbsp salt, annatto oil","Mix the marinade and soak the chicken at least 4 hours. Grill over coals, basting with annatto oil, 25–30 minutes until charred and cooked through. Serve with garlic rice."],
["Pork Sisig","Chopped, sizzling pork with onions and chili","500 g pork belly or face, 1 onion, 3 chilies, 3 tbsp calamansi juice, 2 tbsp soy sauce, 1 egg","Boil then grill or fry the pork until crisp. Chop finely and toss in a hot pan with onion, chilies, soy and calamansi. Serve sizzling with a raw egg cracked on top."]]],
["Savory Soups & Rich Stews",[
["Sinigang","Sour tamarind soup","700 g pork ribs or shrimp, 2 tbsp tamarind base or 10 fresh tamarind, 1 tomato, 1 onion, radish, long beans, eggplant, kangkong, fish sauce","Simmer meat with onion and tomato until tender. Add tamarind and radish; cook 5 minutes. Add beans and eggplant, then greens last. Season with fish sauce."],
["Kare-Kare","Oxtail stew in peanut sauce","1 kg oxtail, ½ cup ground peanuts or peanut butter, ¼ cup toasted ground rice, annatto, eggplant, bok choy, string beans, bagoong","Boil oxtail 2–3 hours until tender. Add annatto-tinted water, peanuts and ground rice; simmer until thick. Add vegetables and cook until just tender. Serve with sautéed bagoong."],
["Kaldereta","Spicy goat or beef stew","1 kg goat or beef, 3 tbsp tomato sauce, 2 potatoes, 2 carrots, 1 bell pepper, 3 tbsp liver spread, 1 tbsp chili, 1 cup water","Sauté garlic and onion, brown the meat, add tomato sauce and water. Simmer 1½–2 hours until tender. Add vegetables, liver spread and chilies; cook 15 minutes more."],
["Bulalo","Beef shank and bone marrow soup","1 kg beef shank with bone, 1 onion, 1 tbsp peppercorns, corn on the cob, cabbage, bok choy, fish sauce","Boil the shank, discard the first scum water, then simmer in fresh water with onion and peppercorns for 2–3 hours. Add corn, then greens. Season with fish sauce."],
["Bicol Express","Pork in spicy coconut milk","500 g pork, 2 cups coconut milk, 5–10 green chilies, 1 onion, 4 garlic cloves, 2 tbsp shrimp paste","Sauté garlic, onion and pork with shrimp paste. Pour in coconut milk and simmer 30 minutes. Add chilies and cook until the sauce is thick and oily."],
["Tinola","Chicken ginger soup","1 kg chicken, 3 tbsp ginger, 1 onion, green papaya or chayote, chili leaves, fish sauce, 6 cups water","Sauté ginger, onion and chicken. Add water and simmer 30 minutes. Add papaya until tender, then chili leaves. Season with fish sauce."],
["Mechado","Beef braised in tomato sauce","1 kg beef chuck, 1 cup tomato sauce, 2 potatoes, 1 carrot, 2 tbsp soy sauce, 1 tbsp calamansi juice, bay leaf","Marinate beef in soy and calamansi. Brown, then sauté with garlic and onion. Add tomato sauce, bay leaf and water; simmer 1½ hours. Add potatoes and carrots until tender."],
["Pochero","Meat and plantain stew","600 g beef or pork, 3 saba bananas, 2 potatoes, chickpeas, cabbage, 1 cup tomato sauce, fish sauce","Simmer meat until tender. Add tomato sauce, bananas, potatoes and chickpeas. Cook until soft, add cabbage last. Season with fish sauce."],
["Dinuguan","Pork blood stew","500 g pork, 1 cup pork blood, ½ cup vinegar, 1 onion, 4 garlic cloves, 2–3 long green chilies, salt","Simmer pork in water and vinegar without stirring for 20 minutes. Sauté garlic and onion, add the pork, then pour in blood slowly while stirring. Simmer 20 minutes until thick. Serve with puto."]]],

["Pancit Palabok","Rice noodles with shrimp sauce","250 g thick rice noodles, 1 cup shrimp broth, annatto, 3 tbsp flour, shrimp, crushed chicharon, hard-boiled eggs, scallions","Boil the noodles. Thicken orange-tinted shrimp broth with flour into a sauce. Pour over the noodles and top with shrimp, egg, chicharon and scallions."],
["Pancit Malabon","Thick noodles in seafood sauce","250 g thick noodles, 1 cup shrimp broth, annatto, flour, squid, shrimp, smoked fish flakes, eggs","Make a thick orange sauce from broth, annatto and flour. Toss with boiled noodles, then top with squid, shrimp, smoked fish and sliced eggs."],
["Pancit Canton","Stir-fried egg noodles","250 g canton noodles, pork or chicken, shrimp, cabbage, carrots, snow peas, 3 tbsp soy sauce, 1½ cups broth","Sauté garlic, onion and meat, then vegetables. Add broth and soy. Add the noodles and toss until tender and dry."],
["Pancit Habhab","Lucban noodles eaten from a banana leaf","200 g miki noodles, pork, cabbage, carrots, chayote, 2 tbsp soy sauce, vinegar","Sauté garlic and pork, add vegetables and soy, then the noodles with a splash of water. Serve on banana leaf with vinegar and eat without utensils."],
["Arroz Caldo","Ginger chicken rice porridge","1 cup glutinous rice, ½ cup rice, 500 g chicken, 3 tbsp ginger, 6 cups broth, fish sauce, toasted garlic, egg, scallions","Sauté ginger and chicken. Add rice and broth; simmer 30–40 minutes, stirring. Season with fish sauce and top with garlic, egg, scallions and calamansi."],
["Goto","Beef tripe rice porridge","1 cup rice, 300 g tripe, 3 tbsp ginger, garlic, onion, 6 cups water, fish sauce, toasted garlic","Boil tripe until tender, then slice. Sauté ginger, garlic and onion, add rice and tripe. Pour in broth and simmer until thick. Season and top with garlic and scallions."],
["Champorado","Chocolate rice porridge","1 cup glutinous rice, 4 cups water, 100 g tablea or cocoa, ½ cup sugar, evaporated milk","Cook the rice in water until soft. Stir in melted tablea and sugar; simmer 10 minutes until thick. Serve with evaporated milk, traditionally alongside dried fish."]]],

["Tocilog","Sweet cured pork, garlic rice and egg","300 g pork slices, 3 tbsp sugar, 1 tbsp salt, ½ tsp curing salt (optional), garlic, annatto","Cure the pork in sugar, salt and garlic for 24 hours. Simmer in a little water until it evaporates, then fry in its own fat until caramelized. Serve with rice and egg."],
["Longsilog","Sweet sausage, garlic rice and egg","4 longganisa links, sinangag, eggs, tomato, vinegar","Simmer longganisa in a little water until it evaporates, then fry in its fat until browned. Serve with sinangag, fried egg and spiced vinegar."],
["Bangsilog","Fried milkfish, garlic rice and egg","1 boneless milkfish (bangus), 4 garlic cloves, 3 tbsp vinegar, 1 tsp salt, ½ tsp pepper, sinangag, eggs","Marinate bangus in vinegar, garlic, salt and pepper for 1 hour. Pat dry and fry until crisp. Serve with sinangag and egg."],

["Fish Balls","Fried fish balls with sweet sauce","300 g fish balls, oil, 1 cup water, 3 tbsp brown sugar, 2 tbsp soy sauce, 1 tbsp flour","Fry the fish balls until puffed and golden. For sauce, simmer water, sugar and soy, then thicken with flour slurry. Serve on sticks."],

["Isaw","Grilled chicken intestines","500 g cleaned chicken intestines, salt, vinegar, bamboo skewers, vinegar dip with chili","Wash very well with salt and vinegar. Boil until tender, thread onto skewers, and grill until charred, brushing with a soy-sugar glaze. Serve with spiced vinegar."],
["Adidas (Chicken Feet)","Grilled marinated chicken feet","10 chicken feet, ¼ cup soy sauce, 2 tbsp vinegar, 2 tbsp sugar, garlic, skewers","Trim the nails and boil until tender, about 40 minutes. Marinate in soy, vinegar, sugar and garlic. Grill, basting, until glazed."],
["Balut","Steamed fertilized duck egg","Fertilized duck eggs (from a trusted source), salt, vinegar with chili and garlic","Simmer eggs in water for 20–30 minutes until fully cooked. Crack the top, sip the broth, season with salt, and eat with spiced vinegar. Always cook thoroughly."]]],

["Ube Halaya","Purple yam jam","500 g grated ube, 1 can condensed milk, 1 can evaporated milk, 3 tbsp butter","Cook everything in a pot over low heat, stirring constantly, for 30–40 minutes until thick. Pour into a greased dish and chill."],

"Leche Flan":"Make the Caramel|Melt the sugar in a pan until golden.|Pour it into the mold and tilt to coat.##Mix the Custard|Mix the egg yolks, both milks and vanilla gently to avoid bubbles.|Strain into the mold.##Steam|Cover with foil and steam for 30–40 minutes.|Chill, then unmold onto a plate.",

const $=s=>document.querySelector(s),list=$("#list"),chips=$("#chips");let cat="All";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
["All",...D.map(d=>d[0])].forEach(n=>{const b=document.createElement("button");b.textContent=n;b.setAttribute("aria-pressed",n==="All");b.onclick=()=>{cat=n;[...chips.children].forEach(c=>c.setAttribute("aria-pressed",c===b));render()};chips.append(b)});
function render(){const q=$("#q").value.trim().toLowerCase();let html="",shown=0;
D.forEach(([name,items])=>{if(cat!=="All"&&cat!==name)return;
const m=items.filter(r=>!q||r.join(" ").toLowerCase().includes(q));if(!m.length)return;shown+=m.length;
html+=`<section><h2>${esc(name)}</h2>`+m.map(([n,d,i,s])=>`<details><summary><b>${esc(n)}</b><span>${esc(d)}</span></summary><div class="body"><h3>Ingredients</h3><ul>${i.split(", ").map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h3>Method</h3>${(M[n]||s).split("##").map(t=>{const [h,...b]=t.split("|");return `<div class="st"><h4>${esc(h)}</h4><ul>${b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}).join("")}</div></details>`).join("")+`</section>`});
list.innerHTML=html;$("#none").style.display=shown?"none":"block"}
$("#q").oninput=render;render();
</script>
